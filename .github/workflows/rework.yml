name: Rework checks

# The rework branch (REWORK_PLAN.md). main keeps deploying v0.42 at /StarTome/ and builds this
# branch into /StarTome/next/; once the checks pass, the last step asks main to deploy again.
on:
  push:
    branches: ["rework"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install
      - name: Lint (includes the layer boundaries)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests of the new app
        run: pnpm test
      - name: Unit tests of the v0.42 code not ported yet
        run: pnpm test:legacy
      - name: Build
        run: pnpm build
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
      - name: Publish the preview at /StarTome/next/
        if: github.ref == 'refs/heads/rework'
        run: gh workflow run nuxtjs.yml --ref main --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
