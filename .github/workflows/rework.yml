name: Rework checks

# The rework branch (REWORK_PLAN.md): nothing is deployed from here; main keeps deploying v0.42.
on:
  push:
    branches: ["rework"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install
      - name: Lint (includes the layer boundaries)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests of the new app
        run: pnpm test
      - name: Unit tests of the v0.42 code not ported yet
        run: pnpm test:legacy
      - name: Build
        run: pnpm build
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
